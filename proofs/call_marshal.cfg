SPECIFICATION Spec

\* Deadlock checking stays ON: a park demand that cannot be served is the
\* `stuck` phase (NotStuck), and any other dead end is a modelling error.
CHECK_DEADLOCK TRUE

\* The production x86-64 configuration (rdx is written by a division);
\* run_call_marshal_tlc.sh derives the bug-injected and RISC ones from this file.
CONSTANTS
    MaxArgs = 3
    Fixed = {"A2"}
    Bug = "none"

INVARIANT TypeOK
INVARIANT NotStuck
INVARIANT SourcesIntact
INVARIANT LoadedIntact
INVARIANT ArgsInPlace
