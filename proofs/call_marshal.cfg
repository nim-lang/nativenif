SPECIFICATION Spec

\* Deadlock checking stays ON: a park demand that cannot be served is the
\* `stuck` phase (NotStuck), and any other dead end is a modelling error.
CHECK_DEADLOCK TRUE

\* The production x86-64 configuration; run_call_marshal_tlc.sh derives the
\* bug-injected ones from this file.
CONSTANTS
    A0 = A0
    A1 = A1
    A2 = A2
    A3 = A3
    S0 = S0
    T0 = T0
    MaxArgs = 3
    Free = Free
    Garbage = Garbage
    Mem = Mem
    Bug = "none"

INVARIANT TypeOK
INVARIANT NotStuck
INVARIANT ParksIntact
INVARIANT MarshalledIntact
INVARIANT ArgsInPlace
