# Tests compile individual nifasm/arkham modules DIRECTLY (e.g. `thumb2_selftest`
# imports `../src/nifasm/thumb2`), so the per-tool nim.cfg next to `nifasm.nim` /
# `arkham.nim` does not apply here. Put the shared source dir on the path so a
# module that reaches into `src/common` still resolves.
--path: "../src/common"
