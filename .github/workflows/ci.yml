name: nifasm ci
on:
  push:
    branches:
    - 'master'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        branch: [master]
        target:
          - os: linux
            cpu: amd64
            nim_branch: devel
          - os: macos
            cpu: arm64
            nim_branch: devel
          - os: windows
            cpu: amd64
            nim_branch: devel
        include:
          - target:
              os: linux
            builder: ubuntu-24.04
          - target:
              os: macos
            builder: macos-15
          - target:
              os: windows
            builder: windows-2025

    name: '${{ matrix.target.os }}-${{ matrix.target.cpu }}-nim-${{ matrix.target.nim_branch }} (${{ matrix.branch }})'
    runs-on: ${{ matrix.builder }}
    env:
      NIM_DIR: nim-${{ matrix.target.nim_branch }}-${{ matrix.target.cpu }}
      NIM_BRANCH: ${{ matrix.target.nim_branch }}
      NIM_ARCH: ${{ matrix.target.cpu }}
    steps:
      - name: set `core.autocrlf` to false
        run: |
          git config --global core.autocrlf false
          git config --global init.defaultBranch master

      - name: Checkout nifasm
        uses: actions/checkout@v7
        with:
          path: nifasm
          submodules: false

      - name: Install Linux dependency (Linux)
        if: runner.os == 'Linux' && matrix.target.cpu == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # THREE emulators, because three of arkham's four back ends have no host
          # here to execute on. Without one the matching suites SKIP and the run
          # reports success, which is the failure mode this whole step exists to
          # avoid — see `NIFASM_REQUIRE_QEMU` below.
          #
          #   qemu-system-arm   the Cortex-M firmware images
          #   qemu-user         `qemu-aarch64`, for the linux_arm64 corpus, the
          #                     a64 stress pass and `a64_slot_base_free`
          #   (riscv system)    the RV32 firmware images
          #
          # Installed on Linux only: these run an emulated image either way, so
          # repeating them on the macOS and Windows runners would be the same
          # coverage three times.
          sudo apt-get install -y valgrind gcc-14 g++-14 qemu-system-arm qemu-user
          # `qemu-system-riscv32` ships in `qemu-system-misc` up to Ubuntu 24.04
          # and in `qemu-system-riscv` from Debian trixie / Ubuntu 25.04 onward.
          # Ask for whichever this runner packages rather than pinning a name that
          # was already renamed once — the binary did not move, only the package.
          if apt-cache show qemu-system-riscv >/dev/null 2>&1; then
            sudo apt-get install -y qemu-system-riscv
          else
            sudo apt-get install -y qemu-system-misc
          fi
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 60 --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Install dependencies (Linux i386)
        if: runner.os == 'Linux' && matrix.target.cpu == 'i386'
        working-directory: ${{ github.workspace }}
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq gcc-multilib g++-multilib \
            libssl-dev:i386

          mkdir -p external/bin
          cat << EOF > external/bin/gcc
          #!/bin/bash

          exec $(which gcc) -m32 "\$@"
          EOF

          cat << EOF > external/bin/g++
          #!/bin/bash

          exec $(which g++) -m32 "\$@"
          EOF

          chmod 755 external/bin/gcc external/bin/g++

          echo "$PWD/external/bin" >> "${GITHUB_PATH}"


      - name: Restore MinGW-W64 (Windows) from cache
        if: runner.os == 'Windows'
        id: windows-mingw-cache
        uses: actions/cache@v6
        with:
          path: external/mingw-${{ matrix.target.cpu }}
          key: 'mingw-${{ matrix.target.cpu }}'

      - name: Restore Nim DLLs dependencies (Windows) from cache
        if: runner.os == 'Windows'
        id: windows-dlls-cache
        uses: actions/cache@v6
        with:
          path: external/dlls-${{ matrix.target.cpu }}
          key: 'dlls-${{ matrix.target.cpu }}'

      - name: Install MinGW64 dependency (Windows)
        if: >
          steps.windows-mingw-cache.outputs.cache-hit != 'true' &&
          runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p external
          if [[ '${{ matrix.target.cpu }}' == 'amd64' ]]; then
            MINGW_URL="https://github.com/brechtsanders/winlibs_mingw/releases/download/11.1.0-12.0.0-9.0.0-r2/winlibs-x86_64-posix-seh-gcc-11.1.0-mingw-w64-9.0.0-r2.7z"
            ARCH=64
          else
            MINGW_URL="https://github.com/brechtsanders/winlibs_mingw/releases/download/11.1.0-12.0.0-9.0.0-r2/winlibs-i686-posix-dwarf-gcc-11.1.0-mingw-w64-9.0.0-r2.7z"
            ARCH=32
          fi
          curl -L "$MINGW_URL" -o "external/mingw-${{ matrix.target.cpu }}.7z"
          7z x -y "external/mingw-${{ matrix.target.cpu }}.7z" -oexternal/
          mv external/mingw$ARCH external/mingw-${{ matrix.target.cpu }}

      - name: Install DLLs dependencies (Windows)
        if: >
          steps.windows-dlls-cache.outputs.cache-hit != 'true' &&
          runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p external
          curl -L "https://nim-lang.org/download/windeps.zip" -o external/windeps.zip
          7z x -y external/windeps.zip -oexternal/dlls-${{ matrix.target.cpu }}

      - name: Path to cached dependencies (Windows)
        if: >
          runner.os == 'Windows'
        shell: bash
        run: |
          echo '${{ github.workspace }}'"/external/mingw-${{ matrix.target.cpu }}/bin" >> $GITHUB_PATH
          echo '${{ github.workspace }}'"/external/dlls-${{ matrix.target.cpu }}" >> $GITHUB_PATH

      #- name: Install winget
      #  if: runner.os == 'Windows'
      #  continue-on-error: true # for some reason errors if latest version already installed
      #  # winget included in windows-2025 and above:
      #  run: winget upgrade winget --accept-package-agreements --accept-source-agreements --disable-interactivity

      #- name: Install make dependencies with winget (Windows)
      #  if: runner.os == 'Windows'
      #  run: winget install ezwinports.make --disable-interactivity --accept-source-agreements

      - name: Install make dependencies with chocolatey (Windows)
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install make

      - name: System Info (Windows)
        if: runner.os == 'Windows'
        run: "gcc -v"

      # - name: Restore Nim from cache
      #   if: >
      #     steps.nim-compiler-cache.outputs.cache-hit != 'true' &&
      #     matrix.target.nim_branch != 'devel'
      #   id: nim-compiler-cache
      #   uses: actions/cache@v2
      #   with:
      #     path: '${{ github.workspace }}/nim-${{ matrix.target.nim_branch }}-${{ matrix.target.cpu }}'
      #     key: 'nim-${{ matrix.target.cpu }}-${{ matrix.target.nim_branch }}'

      - name: Setup Nim
        uses: alaviss/setup-nim@0.1.1
        with:
          path: 'nim'
          version: ${{ matrix.target.nim_branch }}
          architecture: ${{ matrix.target.cpu }}

      - name: Checkout Nimony
        uses: actions/checkout@v7
        with:
          path: nimony
          repository: nim-lang/nimony

      - name: Run tester
        env:
          # Turn every "emulator not found — skipping" into a failure. The tester
          # skips by design so a developer without a cross-emulator can still run
          # what their machine can; in CI that same skip is silent coverage loss,
          # and it has already happened — before this variable existed the
          # workflow installed `qemu-system-arm` alone, so all four RV32 suites,
          # all 219 linux_arm64 run tests and the a64 stress pass skipped on every
          # push and the run was green.
          #
          # Set on the runner that installs the emulators, and only there: the
          # macOS and Windows jobs are expected to skip these, and demanding
          # emulators of them would be demanding coverage they were never meant
          # to provide.
          NIFASM_REQUIRE_QEMU: ${{ (runner.os == 'Linux' && matrix.target.cpu == 'amd64') && '1' || '' }}
        run: |
          cd nifasm
          nim c -r tests/tester.nim