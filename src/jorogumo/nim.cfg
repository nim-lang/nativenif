# jorogumo lives in nativenif and reuses nimony's NIF libraries via its
# committed sibling-relative `nim.cfg` (same arrangement as ithaqua).
--path: "../../../nimony/src/lib"
--path: "../common"
--warning[UnusedImport]: off
--styleCheck: off
# Btw this relies on a Nim bug where it interprets the --outdir relative to
# the current directory instead of the directory of this nim.cfg file.
--outdir: "bin"
