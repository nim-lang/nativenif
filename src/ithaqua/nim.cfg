# ithaqua lives in nativenif and reuses nimony's NIF reader/parser libraries
# plus arkham's language-neutral program model (same arrangement arkham uses).
--path: "../../../nimony/src/lib"
--path: "../arkham"
--path: "../common"
--warning[UnusedImport]: off
--styleCheck: off
# Btw this relies on a Nim bug where it interprets the --outdir relative to the
# current directory instead of the directory of this nim.cfg file.
--outdir: "bin"
